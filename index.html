<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tabu Namfukwe | Home</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            color:#333;
        }

        header{
            background:#003366;
            color:white;
            padding:20px;
            text-align:center;
        }

        /* UNIVERSITY LOGO STYLE */
        .logo{
            width:100px;
            height:100px;
            object-fit:contain;
            margin-bottom:10px;
            background:white;
            padding:5px;
            border-radius:10px;
        }

        nav{
            margin-top:15px;
        }

        nav a{
            text-decoration:none;
            color:white;
            background:#0066cc;
            padding:10px 18px;
            border-radius:5px;
            margin:5px;
            display:inline-block;
            transition:0.3s;
        }

        nav a:hover{
            background:#00aaff;
        }

        .container{
            width:90%;
            max-width:1000px;
            margin:auto;
            padding:20px;
        }

        .hero{
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        /* PROFILE IMAGE STYLE */
        .profile-image{
            width:220px;
            height:220px;
            object-fit:cover;
            border-radius:50%;
            border:5px solid #003366;
            margin-top:20px;
        }

        .info{
            margin-top:20px;
            line-height:1.8;
        }

        footer{
            background:#003366;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:30px;
        }

    </style>
</head>

<body>

<header>

    <!-- UNIVERSITY LOGO -->
    <!-- Replace logo.png with your university logo -->
    <img src="images/logo.png.jpg" alt="University Logo" class="logo">

    <h1>Welcome to My Personal Website</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<div class="container">

    <div class="hero">

        <h2>Hello, I am Tabu Namfukwe</h2>

        <!-- PROFILE IMAGE -->
        <!-- Replace profile.jpg with your picture -->
        <img src="images/myphoto.jpg.jpeg" alt="Profile Picture" class="profile-image">

        <div class="info">

            <p>
                I am a student pursuing a Bachelor of Science in
                Cyber Security.
            </p>

            <p>
                I enjoy networking, web development, programming,
                and computer maintenance.
            </p>

            <p>
                Welcome to my personal website.
            </p>

        </div>

    </div>

</div>

<footer>
    <p>© 2026 Tabu Namfukwe | Personal Website</p>
</footer>

</body>
</html>
