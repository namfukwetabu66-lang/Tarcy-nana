<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        header{
            background:#003366;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            margin-top:10px;
        }

        nav a{
            text-decoration:none;
            color:white;
            background:#0066cc;
            padding:10px 18px;
            border-radius:5px;
            margin:5px;
            display:inline-block;
        }

        nav a:hover{
            background:#00aaff;
        }

        .container{
            width:90%;
            max-width:700px;
            margin:30px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        form input,
        form textarea{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            background:#003366;
            color:white;
            padding:12px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0066cc;
        }

        footer{
            background:#003366;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:30px;
        }

    </style>
</head>
<body>

<header>

    <h1>Contact Me</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<div class="container">

    <h2>Get In Touch</h2>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">

        <label>Message</label>
        <textarea rows="5" placeholder="Write your message"></textarea>

        <button type="submit">Send Message</button>

    </form>

</div>

<footer>
    <p>Email: tabu2@gmail.com</p>
</footer>

</body>
</html>
